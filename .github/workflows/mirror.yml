name: Build install bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror.yml"
      - "scripts/build-bundle.sh"
      - "scripts/platforms.py"
      - "scripts/bundle_inputs.py"
  schedule:
    - cron: "17 3 * * *"    # daily, UTC
  workflow_dispatch:

permissions:
  contents: write           # needed to create the release

concurrency:
  group: bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DH_USER: ${{ secrets.DOCKERHUB_USER }}   # optional, avoids Docker Hub rate limits
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check installer and bundle builder
        run: |
          python3 -B -m unittest discover -s tests -v
          bash -n scripts/build-bundle.sh

      - name: Install skopeo if the runner image lacks it
        run: command -v skopeo >/dev/null || (sudo apt-get update && sudo apt-get install -y skopeo)

      - name: Docker Hub login (optional)
        if: env.DH_USER != ''
        run: skopeo login docker.io -u "$DH_USER" --password-stdin <<<"$DH_TOKEN"

      - name: Build and publish bundle
        run: bash scripts/build-bundle.sh
